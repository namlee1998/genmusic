version: "3.9"

# Penpot — self-hosted design tool
# Run:  docker compose -f docker-compose.penpot.yml up -d
# UI:   http://localhost:9001
# After first launch: register an account, then go to
#   Settings → Access tokens → New token → copy into backend/.env as PENPOT_ACCESS_TOKEN

networks:
  penpot:

volumes:
  penpot_postgres_v15:
  penpot_assets:

services:
  penpot-frontend:
    image: penpotapp/frontend:2.3.2
    restart: unless-stopped
    ports:
      - "9001:80"
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-exporter
    environment:
      - PENPOT_FLAGS=enable-registration enable-login-with-password disable-onboarding-newsletter disable-onboarding-team disable-onboarding disable-telemetry
    networks:
      - penpot

  penpot-backend:
    image: penpotapp/backend:2.3.2
    restart: unless-stopped
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      - penpot-postgres
      - penpot-redis
    environment:
      - PENPOT_FLAGS=enable-registration enable-login-with-password disable-onboarding-newsletter disable-onboarding-team disable-onboarding disable-telemetry enable-access-tokens
      - PENPOT_SECRET_KEY=aifa-demo-secret-change-in-prod
      - PENPOT_DATABASE_URI=postgresql://penpot:penpot@penpot-postgres/penpot
      - PENPOT_DATABASE_USERNAME=penpot
      - PENPOT_DATABASE_PASSWORD=penpot
      - PENPOT_REDIS_URI=redis://penpot-redis/0
      - PENPOT_ASSETS_STORAGE_BACKEND=assets-fs
      - PENPOT_STORAGE_ASSETS_FS_DIRECTORY=/opt/data/assets
      - PENPOT_TELEMETRY_ENABLED=false
      - PENPOT_PUBLIC_URI=http://localhost:9001
    networks:
      - penpot

  penpot-exporter:
    image: penpotapp/exporter:2.3.2
    restart: unless-stopped
    environment:
      - PENPOT_PUBLIC_URI=http://penpot-frontend
      - PENPOT_REDIS_URI=redis://penpot-redis/0
    depends_on:
      - penpot-redis
    networks:
      - penpot

  penpot-postgres:
    image: postgres:15
    restart: unless-stopped
    stop_signal: SIGINT
    volumes:
      - penpot_postgres_v15:/var/lib/postgresql/data
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=penpot
    networks:
      - penpot

  penpot-redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - penpot
